<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Add teacher' if is_new else 'Edit teacher' }} | CVA Let's speak!</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="editor-page unified-page premium-page">
    <div class="page-shell small-shell">
        <header class="editor-header">
            <a href="{{ url_for('teacher_accounts') }}" class="back-link"><span>←</span><span>Back to teachers</span></a>
            <span class="header-badge">CVA Let's speak!</span>
        </header>

        <div class="editor-panel">
            <div class="editor-topcard">
                <div class="avatar">{{ (account.full_name or 'T')[:1]|upper }}</div>
                <div>
                    <p class="eyebrow">TEACHER ACCOUNT</p>
                    <h2>{{ 'Add teacher' if is_new else 'Edit teacher' }}</h2>
                </div>
            </div>

            {% if error %}<div class="alert-box" role="alert">{{ error }}</div>{% endif %}
            <form method="POST" class="editor-form">
                <div class="form-section">
                    <div class="form-grid">
                        <div class="field-group">
                            <label for="full_name">Full name</label>
                            <input id="full_name" class="form-control" name="full_name" value="{{ account.full_name }}" required>
                        </div>
                        <div class="field-group">
                            <label for="username">Username</label>
                            <input id="username" class="form-control" name="username" value="{{ account.username }}" required>
                        </div>
                        <div class="field-group full-width">
                            <label for="email">Email</label>
                            <input id="email" class="form-control" name="email" type="email" value="{{ account.email }}" required>
                        </div>
                        <div class="field-group full-width">
                            <label for="class_name">Class / department</label>
                            <input id="class_name" class="form-control" name="class_name" value="{{ account.class_name or '' }}">
                        </div>
                        <div class="field-group full-width">
                            <label for="password">{{ 'Password (blank uses 123456)' if is_new else 'New password (optional)' }}</label>
                            <input id="password" class="form-control" name="password" type="password" autocomplete="new-password" {% if not is_new %}placeholder="Leave blank to keep current password"{% endif %}>
                        </div>
                    </div>
                </div>
                <div class="section-actions">
                    <a href="{{ url_for('teacher_accounts') }}" class="secondary-btn">Cancel</a>
                    <button type="submit" class="primary-btn">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
