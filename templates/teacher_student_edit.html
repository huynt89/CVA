<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="editor-page unified-page premium-page">
    <div class="page-shell small-shell">
        <header class="editor-header">
            <a href="{{ url_for('teacher_students') }}" class="back-link"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span>Back</span></a>
            <span class="header-badge">CVA Let's speak!</span>
            <div class="language-switcher sidebar-lang">
                <button type="button" data-lang="vi" class="lang-btn {% if lang == 'vi' %}active{% endif %}">VI</button>
                <button type="button" data-lang="en" class="lang-btn {% if lang == 'en' %}active{% endif %}">EN</button>
            </div>
        </header>

        <div class="editor-panel">
            <div class="editor-topcard">
                <div class="avatar">{{ (student.full_name or 'S')[:1]|upper }}</div>
                <div>
                    <p class="eyebrow">Student profile</p>
                    <h2>{{ student.full_name or 'Student detail' }}</h2>
                </div>
            </div>

            {% if error %}
            <div class="alert-box">{{ error }}</div>
            {% endif %}

            <form method="POST" class="editor-form">
                <div class="form-section">
                    <div class="section-title">
                        <span class="section-icon"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.4-4 4.1-6 8-6s6.6 2 8 6"></path></svg></span>
                        <h3>Personal information</h3>
                    </div>

                    <div class="form-grid">
                        <div class="field-group">
                            <label for="full_name">Full name</label>
                            <input id="full_name" class="form-control" name="full_name" type="text" value="{{ student.full_name }}" required>
                        </div>

                        <div class="field-group">
                            <label for="username">Username</label>
                            <input id="username" class="form-control" name="username" type="text" value="{{ student.username or '' }}" required>
                        </div>

                        <div class="field-group full-width">
                            <label for="email">Email</label>
                            <input id="email" class="form-control" name="email" type="email" value="{{ student.email }}" required>
                        </div>

                        <div class="field-group">
                            <label for="class_name">Class</label>
                            <input id="class_name" class="form-control" name="class_name" type="text" value="{{ student.class_name or '' }}">
                        </div>

                        <div class="field-group full-width">
                            <label for="password">New password</label>
                            <input id="password" class="form-control" name="password" type="password" placeholder="Leave blank to keep current password">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-title">
                        <span class="section-icon">🔒</span>
                        <h3>Account status</h3>
                    </div>

                    <label class="toggle-field">
                        <input type="checkbox" name="is_active" {% if student.is_active %}checked{% endif %}>
                        <span>Active</span>
                    </label>
                </div>

                <div class="section-actions">
                    <a href="{{ url_for('teacher_students') }}" class="secondary-btn">Cancel</a>
                    <button type="submit" class="primary-btn">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
