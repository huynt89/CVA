<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ lesson.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="premium-page lesson-page">
    <div class="page-shell">
        <header class="page-topbar">
            <div>
                <a href="{{ url_for('dashboard') }}" class="back-link icon-only" aria-label="Back" title="Back"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
            </div>
            <div class="page-title">
                <span class="pill">Grade {{ lesson.class_level or 6 }}</span>
                <h2>{{ lesson.title }}</h2>
            </div>
        </header>

        <div class="lesson-layout">
            <div class="video-panel card">
                <video controls width="100%" poster="https://images.unsplash.com/...">
                    <source src="{{ lesson.video }}" type="video/mp4">
                </video>
                <div class="video-caption">
                    <h3>{{ lesson.topic }}</h3>
                    <p>{{ lesson.goal }}</p>
                </div>
            </div>

            <aside class="lesson-sidebar card">
                <h3>Key vocabulary</h3>
                <ul class="vocab-list">
                    {% for vocab in lesson.vocabulary %}
                    <li>{{ vocab }}</li>
                    {% endfor %}
                </ul>
                <h3>Sentence pattern</h3>
                <p class="highlight-text">{{ lesson.dialogue }}</p>
                <a class="primary-btn full-width" href="{{ url_for('exercise', lesson_id=lesson.id) }}">Practice now</a>
            </aside>
        </div>
    </div>
</body>
</html>
